services:
  ravendb:
    image: ravendb/ravendb:latest
    container_name: ccscammers-ravendb
    ports:
      - '8080:8080' # HTTP / Studio
      - '38888:38888' # TCP (cluster + subscriptions)
    environment:
      # Unsecured is fine for local development only. Never use this in production;
      # see README for the certificate-based setup the API already supports.
      RAVEN_Setup_Mode: None
      RAVEN_License_Eula_Accepted: 'true'
      RAVEN_Security_UnsecuredAccessAllowed: PrivateNetwork
      RAVEN_ServerUrl: http://0.0.0.0:8080
      RAVEN_ServerUrl_Tcp: tcp://0.0.0.0:38888
      RAVEN_PublicServerUrl: http://localhost:8080
      RAVEN_PublicServerUrl_Tcp: tcp://localhost:38888
    volumes:
      - ravendb-data:/var/lib/ravendb/data
      - ravendb-config:/var/lib/ravendb/config
    restart: unless-stopped

volumes:
  ravendb-data:
  ravendb-config:
